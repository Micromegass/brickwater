name: Deploy to goneo

# Builds the site and uploads it to the artist's hosting at goneo over SFTP,
# every night and on demand (Actions -> "Deploy to goneo" -> Run workflow).
#
# It runs nightly even when nothing was pushed, because a static export decides
# at build time which concerts are still upcoming: without a rebuild a concert
# that has been played stays under "Demnächst".
#
# Two jobs on purpose: `build` runs npm and never sees a credential, `publish`
# holds the SFTP login and runs nothing from node_modules. A compromised
# dependency therefore cannot reach the server.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   GONEO_USER       the SFTP user
#   GONEO_PASSWORD   the SFTP password
# The server, its port and the document root are not secret and live below.

on:
  schedule:
    # 01:23 UTC is 03:23 in Nürnberg in summer, 02:23 in winter. GitHub starts
    # scheduled runs late when it is busy, sometimes by hours, so the upload
    # below is ordered to be invisible to a visitor whenever it lands.
    - cron: "23 1 * * *"
  workflow_dispatch:

concurrency:
  group: goneo-deploy
  cancel-in-progress: false

env:
  GONEO_HOST: w11.goneo.de
  GONEO_PORT: "2222"
  GONEO_ROOT: /htdocs
  # The server's own key, pinned so the password is only ever sent to goneo.
  # Taken with `ssh-keyscan -p 2222 w11.goneo.de` on 2026-09-28,
  # SHA256:G3pffhoFJHdoHklKqgM8jTYFfQhJXzuJOfLGzxwjffY. If goneo ever changes
  # it the upload stops with a host key error; check the new fingerprint with
  # goneo before replacing this line.
  GONEO_KNOWN_HOST: "[w11.goneo.de]:2222 ssh-rsa "

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.brickwater.de
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site-goneo
          path: out
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-goneo
          path: site

      - name: Sanity-check the artifact
        run: |
          test -f site/index.html || { echo "artifact has no index.html; refusing to upload" >&2; exit 1; }
          test -f site/.htaccess || { echo "artifact has no .htaccess; refusing to upload" >&2; exit 1; }
          echo "files to upload: $(find site -type f | wc -l)"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp drives the system ssh for SFTP. Pointing it at a known_hosts file
      # holding only goneo's key, with strict checking, makes a server that
      # answers with any other key a hard failure before the password is sent.
      - name: Trust goneo's host key and nothing else
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$GONEO_KNOWN_HOST" > ~/.ssh/known_hosts_goneo
          cat > ~/.lftprc <<EOF
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_goneo"
          set sftp:auto-confirm no
          set net:max-retries 2
          set cmd:trace off
          EOF

      # A mirror deletes whatever is no longer in the build, so refuse if the
      # directory looks like an account root rather than a web root: mail or
      # log directories there mean the path is wrong. Only a listing, never a
      # downloaded copy kept as an artifact, because this repository is public
      # and its artifacts can be downloaded by anyone.
      - name: Look at what is on the server now
        env:
          LFTP_PASSWORD: ${{ secrets.GONEO_PASSWORD }}
          USER: ${{ secrets.GONEO_USER }}
        run: |
          lftp -u "$USER" --env-password "sftp://$GONEO_HOST:$GONEO_PORT" -e "cls -1 '$GONEO_ROOT'; bye" > listing.txt
          echo "Currently in ${GONEO_ROOT}:"
          sed 's/^/    /' listing.txt
          if grep -qiE '^(mail|logs?|logfiles|backup|\.ssh|etc)/?$' listing.txt; then
            echo "That looks like an account root, not a document root. Refusing to mirror into it." >&2
            exit 1
          fi

      # Three passes so a visitor never gets a page whose files are missing:
      # 1. new scripts and images go up first, beside the old ones. Everything
      #    under _next/ carries a content hash in its name, so size is enough
      #    to skip what is unchanged; images/ has a few fixed names (the paint
      #    and the logo), so there the usual size-and-time check applies.
      # 2. the pages and everything else are replaced; stale pages are removed.
      # 3. only then are scripts and images no page refers to any more removed.
      - name: Upload the site
        env:
          LFTP_PASSWORD: ${{ secrets.GONEO_PASSWORD }}
          USER: ${{ secrets.GONEO_USER }}
        run: |
          lftp -u "$USER" --env-password "sftp://$GONEO_HOST:$GONEO_PORT" -e "
            set mirror:parallel-transfer-count 4;
            mirror --reverse --ignore-time --no-perms --verbose=1 site/_next '$GONEO_ROOT/_next';
            mirror --reverse --no-perms --verbose=1 site/images '$GONEO_ROOT/images';
            mirror --reverse --delete --no-perms --verbose=1 --exclude-glob _next/ --exclude-glob images/ site '$GONEO_ROOT';
            mirror --reverse --delete --ignore-time --no-perms --verbose=1 site/_next '$GONEO_ROOT/_next';
            mirror --reverse --delete --no-perms --verbose=1 site/images '$GONEO_ROOT/images';
            bye
          "
          echo "Live at https://www.brickwater.de/"

  # GitHub switches off scheduled workflows in a repository that has seen no
  # commit for 60 days. The artist may well not touch the site for that long,
  # and the nightly rebuild would then stop without anyone noticing. Enabling
  # the workflow again from inside it resets that clock. This job holds no
  # secret and may do nothing but manage workflows.
  keepalive:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the nightly schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/deploy-goneo.yml/enable"
