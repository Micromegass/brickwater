name: Deploy to GitHub Pages

# The Pages site is served from the `gh-pages` branch, which is what enabling it
# by pushing that branch gives you. So this builds the site and force-pushes the
# output there; `gh-pages` is output, never source.
#
# A project page serves under /<repo>/, so the build is told where it lives and
# every URL it emits is prefixed. It is also marked noindex: this is a preview,
# and it must never compete with brickwater.de in search.
#
# The write token and the dependency install are deliberately in different jobs.
# `build` runs npm and has read-only contents; `publish` holds the token that can
# write to the repository and runs nothing from node_modules.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Written to step outputs, not GITHUB_ENV: these belong to the build step
      # alone. The unit tests assert the production URLs, so exporting them to
      # the whole job makes `npm run check` fail on its own contract.
      - name: Work out where this page will live
        id: where
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "base_path=/${repo}"
            echo "site_url=https://${owner}.github.io/${repo}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Content, types, lint and unit tests. The end-to-end suite runs in ci.yml
      # against a root build; repeating it here would only pay for it twice.
      - run: npm run check

      # prebuild validates content, postbuild verifies every internal link,
      # which is what proves the base path was threaded through everywhere.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.where.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.where.outputs.site_url }}
          NEXT_PUBLIC_NOINDEX: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Force-push the build onto gh-pages
        working-directory: site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f index.html || { echo "no index.html in the artifact"; exit 1; }
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built site for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
